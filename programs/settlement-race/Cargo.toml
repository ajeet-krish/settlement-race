[package]
name = "settlement-race"
version = "0.1.0"
description = "Tokenized USD/CAD exchange comparing sequential pay-first settlement against atomic delivery-versus-payment on Solana devnet"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "settlement_race"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

# Anchor's program macro emits cfg(target_os = "solana"), which host rustc
# does not know unless it is declared here.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = "1.2.2"

[dev-dependencies]
# anchor-litesvm 0.4.0 depends on anchor-lang ^1.0.0 (unifies to the pinned
# 1.2.2) and litesvm 0.11, matching the Phase 1 anchor-litesvm test decision.
anchor-litesvm = "0.4.0"
