# Deploys the Vite app to GitHub Pages (project site at /settlement-race/).
# Build and test run here so a red build blocks the deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, publish Pages, mint the OIDC token for it.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy, and serialize all Pages runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Node 26 with the exact npm the app lockfile was authored with:
      # npm 10 (bundled with node 22) rejects app/package-lock.json with
      # "Missing: typescript@5.9.3 from lock file", while npm 11 accepts it.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Pin npm to the lock authoring version
        run: npm install -g npm@11.20.0

      - name: Install dependencies
        run: npm ci

      # Vitest suite (offline by design), runs before any build output exists.
      - name: Run tests
        run: npm test

      # Base path comes from the CLI so vite.config.ts stays untouched.
      # package.json build script is "tsc --noEmit && vite build",
      # and npm appends the flag to vite build.
      - name: Build
        run: npm run build -- --base=/settlement-race/

      # Prove no devnet private keys ship: demo-accounts.json must be gone,
      # and no JSON file under dist may mention secretKey at all.
      - name: Security guard
        run: |
          if [ -f dist/demo-accounts.json ]; then
            echo "FAIL: dist/demo-accounts.json exists but must never ship"
            exit 1
          fi
          if grep -r --include='*.json' 'secretKey' dist; then
            echo "FAIL: a dist JSON file contains secretKey"
            exit 1
          fi
          echo "OK: no private key material in dist"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
